name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the forecast grids (scripts/fetch-forecast.ts) after each model cycle lands.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scheduled runs have no github.event.repository, so take the name from GITHUB_REPOSITORY.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      # Fetch every forecast grid once for all users (docs/DATA.md). A failed feed keeps the
      # previously published files, so the site still deploys and DATA AGE shows the age.
      - run: npm run data:forecast
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io${{ env.BASE_PATH }}data/forecast/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
