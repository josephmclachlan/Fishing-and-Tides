name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly: relays the Limón METAR and NHC storms; model grids refresh only when their refreshH
  # has passed (scripts/fetch-forecast.ts), so the hourly runs cost no Open-Meteo calls.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: with the data build each run takes a few minutes, and a burst of
# merges would otherwise cancel every run before any deploys. GitHub keeps only the newest
# pending run, so a burst still ends in one deploy of the latest main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Copernicus Marine toolbox for the ASCAT wind passes (scripts/scat.py, PLAN 2.14) and the mixed-layer depth (scripts/mld.py, PLAN 7.18).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Scheduled runs have no github.event.repository, so take the name from GITHUB_REPOSITORY.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      # Fetch every forecast grid once for all users (docs/DATA.md). A failed feed keeps the
      # previously published files, so the site still deploys and DATA AGE shows the age.
      - run: npm run data:forecast
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io${{ env.BASE_PATH }}data/forecast/
          # Free Copernicus Marine account for the ASCAT passes (scat-pass) and mixed-layer depth (mld). Only this step sees them;
          # without them those feeds fail and keep their previous files.
          COPERNICUSMARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
          # Free Global Fishing Watch API token for the fishing effort map (effort, PLAN 7.19).
          GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
