name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Hourly: relays the Limón METAR and NHC storms; model grids refresh only when their refreshH
  # has passed (scripts/fetch-forecast.ts), so the hourly runs cost no Open-Meteo calls.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: with the data build each run takes a few minutes, and a burst of
# merges would otherwise cancel every run before any deploys. GitHub keeps only the newest
# pending run, so a burst still ends in one deploy of the latest main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Copernicus Marine toolbox for the ASCAT wind passes (scripts/scat.py, PLAN 2.14), the mixed-layer depth (scripts/mld.py, PLAN 7.18) and the GlobColour Kd490 (scripts/oc.py, PLAN 7.47).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Scheduled runs have no github.event.repository, so take the name from GITHUB_REPOSITORY.
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      # Fetch every forecast grid once for all users (docs/DATA.md). A failed feed keeps the
      # previously published files, so the site still deploys and DATA AGE shows the age.
      - run: npm run data:forecast
        env:
          FALLBACK_URL: https://${{ github.repository_owner }}.github.io${{ env.BASE_PATH }}data/forecast/
          # Free Copernicus Marine account for the ASCAT passes (scat-pass), mixed-layer depth (mld) and GlobColour Kd490 (kd490-nrt). Only this step sees them;
          # without them those feeds fail and keep their previous files.
          COPERNICUSMARINE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
          # Free NASA Earthdata account for the IMERG satellite rain (rain-imerg, PLAN 7.51); same rule.
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      # Hand the fresh feeds to the archive job (PLAN 8.1) so it can save today's history.
      - uses: actions/upload-artifact@v4
        with:
          name: forecast-data
          path: public/data/forecast
          retention-days: 1
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    # GitHub Pages sometimes leaves a deployment stuck "in progress" on its side well past the
    # action's 10 min timeout (2026-11-04: about 30 min). Until it clears, every new deploy is
    # refused ("due to in progress deployment"). Wait and try again twice before failing.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 300
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.retry1.outcome == 'failure'
        run: sleep 600
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
  # Daily history (PLAN 8.1, docs/HISTORY.md): samples the feeds the build just fetched at the
  # spots, plus the tide gauge and each weather model at the airport, and appends them to one CSV
  # per day on the `history` branch. Public ocean data only. Its own job, so only it can push, and
  # a failure here never holds up the deploy.
  archive:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: forecast-data
          path: public/data/forecast
      - name: Check out the history branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin history; then
            git fetch --depth=1 origin history
            git worktree add history FETCH_HEAD
          else
            git worktree add --orphan -b history history
          fi
      - run: npm run data:archive
        env:
          HISTORY_DIR: history
      - name: Commit and push
        working-directory: history
        run: |
          git add -A
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "History $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push origin HEAD:refs/heads/history && exit 0; sleep $((i * 5)); git pull -q --rebase --depth=1 origin history || true; done
          exit 1
