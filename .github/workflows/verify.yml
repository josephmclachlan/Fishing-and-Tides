name: Verify feeds

# PLAN 2.8: once a day, run every adapter's checks (src/verify/registry.ts, the same list the
# SYSTEM CHECK panel runs) against the live site. Open or update one tracking issue while any
# feed fails; close it when they all recover. Amber (stale, disagreeing) is reported, not raised.
on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          VERIFY_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name || 'Fishing-and-Tides' }}/
      - run: cat verify-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { results } = JSON.parse(fs.readFileSync('verify-report.json', 'utf8'));
            const report = fs.readFileSync('verify-report.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const label = 'verify';
            const title = 'SYSTEM CHECK: data feeds failing';
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            const issue = open[0];
            const failing = results.some((r) => r.status === 'fail');
            const body = `${report}\n\n[Run](${run}) · checks in \`src/verify/\` · this issue closes itself when every feed passes.`;
            if (failing && !issue) {
              await github.rest.issues.create({ ...context.repo, title, body, labels: [label] });
            } else if (failing && issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Still failing. ${report.split('\n')[2]} ([run](${run}))` });
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Recovered: no feed is failing.\n\n${report}\n\n[Run](${run})` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
