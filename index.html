<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EEF3F8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="SurCast" />
    <meta name="description" content="SurCast: ocean forecasts for fishing, spearfishing, snorkelling, diving, surfing, sailing, swimming and paddling on Costa Rica's southern Caribbean coast, Gandoca to Limón." />
    <title>SurCast</title>
    <script>try{var d=document.documentElement,s=localStorage.getItem('ft.fcScheme');d.dataset.theme='modern';d.classList.add('km');d.dataset.scheme=s==='light'||s==='dark'?s:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){}</script>
  </head>

    <div id="map"></div>
    <div id="hud"></div>
    <div class="crt" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
